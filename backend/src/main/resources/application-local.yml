# Local development profile. Reads credentials from the repository's .env file (generated by
# scripts/init-local-env.sh, never committed) when run from the backend directory.
spring:
  config:
    import:
      - optional:file:../.env[.properties]
      - optional:file:.env[.properties]

medassist:
  security:
    open-api-public: ${OPENAPI_PUBLIC:true}
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173}
  demo:
    seed-enabled: ${DEMO_SEED_ENABLED:true}

logging:
  level:
    com.medassist: DEBUG
