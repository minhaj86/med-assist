# Production profile: no defaults for connection details, structured logs, hardened API surface.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_APP_USER}
    password: ${DB_APP_PASSWORD}
  flyway:
    user: ${DB_MIGRATION_USER}
    password: ${DB_MIGRATION_PASSWORD}
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${OIDC_JWK_SET_URI}
          issuer-uri: ${OIDC_ISSUER_URI}
          audiences: ${OIDC_AUDIENCE}

logging:
  structured:
    format:
      console: ecs

springdoc:
  api-docs:
    enabled: ${OPENAPI_ENABLED:false}
  swagger-ui:
    enabled: ${OPENAPI_ENABLED:false}

management:
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}

medassist:
  security:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
    open-api-public: false
    hsts-enabled: ${HSTS_ENABLED:true}
  demo:
    seed-enabled: false
