# MedAssist local stack. Run `scripts/init-local-env.sh` once to generate .env (random local secrets), then:
#   docker compose up --build
# UI: http://localhost:4173  · Keycloak: http://localhost:8180  · API docs: http://localhost:8081/swagger-ui.html
# Optional profiles: `--profile local-llm` (Ollama container), `--profile tracing` (Jaeger for OpenTelemetry traces).
# All demo data is SYNTHETIC. Host ports are bound to 127.0.0.1 only.
name: medassist

x-db-secrets: &db-secrets
  MEDASSIST_DB_OWNER_PASSWORD: ${MEDASSIST_DB_OWNER_PASSWORD:?Run scripts/init-local-env.sh to create .env}
  MEDASSIST_DB_APP_PASSWORD: ${MEDASSIST_DB_APP_PASSWORD:?Run scripts/init-local-env.sh to create .env}
  KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Run scripts/init-local-env.sh to create .env}

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    mem_limit: 512m
    environment:
      <<: *db-secrets
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?Run scripts/init-local-env.sh to create .env}
      POSTGRES_DB: postgres
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d medassist"]
      interval: 5s
      timeout: 5s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    command: ["start-dev", "--import-realm"]
    restart: unless-stopped
    mem_limit: 900m
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Run scripts/init-local-env.sh to create .env}
      # Browser-facing URL; tokens carry this issuer. Containers reach Keycloak via http://keycloak:8080.
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT:-8180}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      JAVA_OPTS_KC_HEAP: -XX:MaxRAMPercentage=60 -XX:InitialRAMPercentage=25
      MEDASSIST_DEMO_USER_PASSWORD: ${MEDASSIST_DEMO_USER_PASSWORD:?Run scripts/init-local-env.sh to create .env}
    volumes:
      - ./docker/keycloak/medassist-realm.json:/opt/keycloak/data/import/medassist-realm.json:ro
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT:-8180}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  backend:
    build: ./backend
    image: medassist-backend:local
    restart: unless-stopped
    # The JVM sizes its heap from this limit (MaxRAMPercentage=75 in the image).
    mem_limit: 1280m
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_URL: jdbc:postgresql://postgres:5432/medassist
      DB_APP_USER: medassist_app
      DB_APP_PASSWORD: ${MEDASSIST_DB_APP_PASSWORD}
      DB_MIGRATION_USER: medassist_owner
      DB_MIGRATION_PASSWORD: ${MEDASSIST_DB_OWNER_PASSWORD}
      OIDC_JWK_SET_URI: http://keycloak:8080/realms/medassist/protocol/openid-connect/certs
      OIDC_ISSUER_URI: http://localhost:${KEYCLOAK_PORT:-8180}/realms/medassist
      OIDC_AUDIENCE: medassist-api
      CORS_ALLOWED_ORIGINS: http://localhost:4173,http://localhost:5173
      MANAGEMENT_PORT: "9091"
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
      LOGGING_LEVEL_COM_MEDASSIST: INFO
      DEMO_SEED_ENABLED: ${DEMO_SEED_ENABLED:-true}
      # AI is optional: with AI_PROVIDER=none every deterministic feature keeps working.
      AI_PROVIDER: ${AI_PROVIDER:-none}
      AI_RESPONSE_FORMAT: ${AI_RESPONSE_FORMAT:-json_object}
      AI_TIMEOUT: ${AI_TIMEOUT:-90s}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
      AZURE_OPENAI_DEPLOYMENT: ${AZURE_OPENAI_DEPLOYMENT:-}
      AZURE_OPENAI_API_VERSION: ${AZURE_OPENAI_API_VERSION:-}
      LOCAL_LLM_BASE_URL: ${LOCAL_LLM_BASE_URL:-http://host.docker.internal:11434/v1}
      LOCAL_LLM_API_KEY: ${LOCAL_LLM_API_KEY:-}
      LOCAL_LLM_MODEL: ${LOCAL_LLM_MODEL:-}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-local-hashing}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-0}
      TRACING_EXPORT_ENABLED: ${TRACING_EXPORT_ENABLED:-false}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://jaeger:4318/v1/traces
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      # API (also proxied by the frontend). The management port 9091 stays on the internal network.
      - "127.0.0.1:${BACKEND_PORT:-8081}:8081"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9091 && printf 'GET /actuator/health/readiness HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  frontend:
    build: ./frontend
    image: medassist-frontend:local
    restart: unless-stopped
    mem_limit: 128m
    environment:
      BACKEND_URL: http://backend:8081
      OIDC_ORIGIN: http://localhost:${KEYCLOAK_PORT:-8180}
      MEDASSIST_OIDC_AUTHORITY: http://localhost:${KEYCLOAK_PORT:-8180}/realms/medassist
      MEDASSIST_OIDC_CLIENT_ID: medassist-web
      MEDASSIST_KEYCLOAK_ADMIN_URL: http://localhost:${KEYCLOAK_PORT:-8180}/admin/medassist/console/
      MEDASSIST_ENVIRONMENT_LABEL: LOCAL DEMO · SYNTHETIC DATA ONLY
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-4173}:8080"
    depends_on:
      backend:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.15.0
    restart: unless-stopped
    mem_limit: 384m
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=7d"]
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      - backend

  # Optional local LLM (OpenAI-compatible API). Enable with --profile local-llm and set
  #   AI_PROVIDER=openai-compatible LOCAL_LLM_BASE_URL=http://ollama:11434/v1 LOCAL_LLM_MODEL=<model>
  # then pull the model once: docker compose exec ollama ollama pull <model>
  ollama:
    image: ollama/ollama:latest
    profiles: ["local-llm"]
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama

  # Optional trace viewer. Enable with --profile tracing and TRACING_EXPORT_ENABLED=true; UI at http://localhost:16686
  jaeger:
    image: jaegertracing/jaeger:2.22.0
    profiles: ["tracing"]
    ports:
      - "127.0.0.1:16686:16686"

volumes:
  postgres-data:
  prometheus-data:
  ollama-data:
