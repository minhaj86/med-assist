# Scrapes technical metrics only (no patient identifiers are ever used as metric labels).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: medassist-backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["backend:9091"]
        labels:
          service: medassist-backend
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
